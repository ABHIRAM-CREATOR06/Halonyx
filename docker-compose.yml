version: '3.8'

services:
  halonyx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: halonyx-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - halonyx-db-data:/app/backend/db
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  halonyx-db-data:
    driver: local
