name: Bug report
description: Something in Halonyx isn't working the way it should
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Halonyx.
        **Do not paste private keys, JWTs, USIDs you want to keep private, safety numbers, or IndexedDB/session state.**
        If you found a security vulnerability, use the private reporting link on the issue chooser page instead of this form.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app and sign up
        2. Add a contact
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend / UI
        - Backend / server
        - Protocol (X3DH / Double Ratchet / keys)
        - File transfer (WebTorrent)
        - Tests / CI
        - Not sure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and version, OS, and Node version if self-hosting.
      placeholder: "Firefox 130, Windows 11, Node 22"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did you run it?
      options:
        - Live demo (halonyx.onrender.com)
        - Self-hosted / local
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console or server logs
      description: Redact anything sensitive first.
      render: shell
  - type: checkboxes
    id: protocol
    attributes:
      label: Checks
      options:
        - label: This bug may involve `protocol/` (encryption, ratchet, key handling)
        - label: I searched existing issues and didn't find a duplicate
          required: true
